        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ${ANDROID_NDK_HOME:-../../../prebuilts/toolchains/android-ndk/r29}
        target: /opt/toolchains/android-ndk
        read_only: true
        bind:
          create_host_path: false
    command:
      - bash
      - infra/container_env/tasks/build-kernperf.sh
      - --target-system
      - android_aarch64_ndk29
      - --hexagon-gdn

  # Same GenieX shared ggml closure, but exposes the standalone
  # HTP_OP_SOFTMAX_ILP probe (--op softmax_ilp2/4/8/16) so the FA S-tile softmax
  # body can be timed in isolation with N rows per iteration.  The FA op itself
  # is left untouched.  Structural timing/PMU gate only; output is undefined.
  eperf-kernperf-hexagon-softmax-android-aarch64-ndk29:
    <<: *kernperf-build
    container_name: eperf-kernperf-hexagon-softmax-android-aarch64-ndk29
