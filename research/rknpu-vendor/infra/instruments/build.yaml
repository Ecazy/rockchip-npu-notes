        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ${ANDROID_NDK_HOME:-../../../prebuilts/toolchains/android-ndk/r29}
        target: /opt/toolchains/android-ndk
        read_only: true
        bind:
          create_host_path: false
    command:
      - bash
      - infra/container_env/tasks/build-kernperf.sh
      - --target-system
      - android_aarch64_ndk29
      - --hexagon-bandwidth

  # Real ggml layout ops (CONT/CPY/CONCAT/REPEAT/PAD) through the same GenieX
  # shared ggml closure as the FLASH_ATTN_EXT probe.
  eperf-kernperf-hexagon-layout-android-aarch64-ndk29:
