      - type: bind
        source: ${GNU_AARCH64_TOOLCHAIN_ROOT:-../../../prebuilts/toolchains/gnu-aarch64/arm-gnu-toolchain-11.3.rel1-x86_64-aarch64-none-linux-gnu}
