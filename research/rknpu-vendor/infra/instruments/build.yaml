    command:
      - bash
      - infra/container_env/tasks/build-instruments.sh
      - --target-system
      - android_aarch64_ndk29

  # Native on-device Snapdragon Profiler collector.  This target is separate
  # from the OpenCL hook because it samples SDP DSP/GPU providers rather than
  # intercepting graphics API calls.
  eperf-instruments-sdp-device-android-aarch64-ndk29:
    <<: *opencl-hook-build
    container_name: eperf-instruments-sdp-device-android-aarch64-ndk29
