      - bash
      - infra/container_env/tasks/build-kernperf.sh
      - --target-system
      - linux_aarch64_gnu11_3
      - --hexagon-flash-attn

  # Chunked-GDN operator probe: builds the state-update core as ggml MUL_MATs
  # (F32 vs F16 left operand) and validates against a host fp64 reference, so the
  # HMX precision/performance trade can be reproduced on device.
  eperf-kernperf-hexagon-gdn-android-aarch64-ndk29:
    <<: *kernperf-build
    container_name: eperf-kernperf-hexagon-gdn-android-aarch64-ndk29
    profiles: ["kernperf-hexagon-gdn"]
