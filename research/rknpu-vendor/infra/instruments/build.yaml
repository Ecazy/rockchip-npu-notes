    command:
      - bash
      - infra/container_env/tasks/build-kernperf.sh
      - --target-system
      - android_aarch64_ndk29
      - --hexagon-softmax

  # Pure Hexagon memory-bandwidth probe (HTP_OP_MEMBW): HVX vmem streaming
  # against cacheable L2/DDR and VTCM, selected by --path/--dir.
  eperf-kernperf-hexagon-bandwidth-android-aarch64-ndk29:
