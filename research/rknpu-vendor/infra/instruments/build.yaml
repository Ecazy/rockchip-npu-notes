        target: /opt/toolchains/android-ndk
        read_only: true
        bind:
          create_host_path: false
    command:
      - bash
      - infra/container_env/tasks/build-kernperf.sh
      - --target-system
      - android_aarch64_ndk29
      - --hexagon-flash-attn

  # linux-aarch64 (glibc) HTP probe for Rhino Pi-X1 (SM8550 / HTP v73).  Links
  # the GenieX linux-aarch64 shared ggml closure plus the v73 DSP skeleton; the
  # closure is staged under the repo so the build does not depend on a
  # target-specific cache layout.
  eperf-kernperf-hexagon-flash-attn-linux-aarch64-gnu11.3:
    <<: *kernperf-build
    container_name: eperf-kernperf-hexagon-flash-attn-linux-aarch64-gnu11.3
    profiles: ["kernperf-hexagon-flash-attn-linux"]
    volumes:
