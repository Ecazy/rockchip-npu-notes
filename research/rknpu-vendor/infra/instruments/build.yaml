        source: ../../..
        target: /root/eperf-exporter
      - type: bind
        source: ${CACHE_ROOT:?CACHE_ROOT_is_required}
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ${ANDROID_NDK_HOME:-../../../prebuilts/toolchains/android-ndk/r29}
        target: /opt/toolchains/android-ndk
        read_only: true
        bind:
          create_host_path: false
    command:
      - bash
      - infra/container_env/tasks/build-kernperf.sh
      - --target-system
      - android_aarch64_ndk29
      - --cpu-providers
      - --mnn-provider
      - --ggml-provider
      - --gpu-providers

  # Links only against the already built Android ggml Hexagon static artifact;
  # the FastRPC/DSP skeleton is staged by build-kernperf.sh for device use.
  eperf-kernperf-hexagon-bmm-android-aarch64-ndk29:
    <<: *kernperf-build
    container_name: eperf-kernperf-hexagon-bmm-android-aarch64-ndk29
    profiles: ["kernperf-hexagon-bmm"]
    volumes:
      - type: bind
        source: ../../..
        target: /root/eperf-exporter
      - type: bind
        source: ${CACHE_ROOT:?CACHE_ROOT_is_required}
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ${ANDROID_NDK_HOME:-../../../prebuilts/toolchains/android-ndk/r29}
        target: /opt/toolchains/android-ndk
        read_only: true
        bind:
          create_host_path: false
    command:
      - bash
      - infra/container_env/tasks/build-kernperf.sh
      - --target-system
      - android_aarch64_ndk29
      - --hexagon-bmm

  # Reuses the same ggml Hexagon static artifact and DSP skeleton as the BMM
  # probe, but constructs the actual FLASH_ATTN_EXT graph on the host.
  eperf-kernperf-hexagon-flash-attn-android-aarch64-ndk29:
