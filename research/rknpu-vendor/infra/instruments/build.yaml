name: eperf-instruments-build

x-opencl-hook-build: &opencl-hook-build
  image: eperf-build/instruments:opencl-hook-v1
  build:
    context: ../../..
    dockerfile: infra/container_env/docker/framework-build.Dockerfile
    args:
      CMAKE_VERSION: "4.2.5"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      all_proxy: ${all_proxy:-}
      no_proxy: ${no_proxy:-}
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  cpus: "${CONTAINER_CPUS:-64}"
  mem_limit: "${CONTAINER_MEMORY_LIMIT:-128g}"
  working_dir: /root/eperf-exporter
  init: true
  restart: "no"
  env_file:
    - path: ../../../.env
      required: false
  environment:
    HOME: /home/ubuntu
    REPO_ROOT: /root/eperf-exporter
    CACHE_ROOT: /cache
    IMAGE_CACHE_ROOT: /cache/container_env/eperf-build/instruments
    BUILD_JOBS: ${BUILD_JOBS:-64}
    CMAKE_BUILD_PARALLEL_LEVEL: ${CMAKE_BUILD_PARALLEL_LEVEL:-64}
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    ALL_PROXY: ${ALL_PROXY:-}
    NO_PROXY: ${NO_PROXY:-}
    http_proxy: ${http_proxy:-}
    https_proxy: ${https_proxy:-}
    all_proxy: ${all_proxy:-}
    no_proxy: ${no_proxy:-}
  volumes:
    - type: bind
      source: ../../..
      target: /root/eperf-exporter
    - type: bind
      source: ${CACHE_ROOT:?CACHE_ROOT_is_required}
      target: /cache
      bind:
        create_host_path: false

x-kernperf-build: &kernperf-build
  <<: *opencl-hook-build

services:
  eperf-instruments-opencl-hook-v1-linux-x64:
    <<: *opencl-hook-build
    container_name: eperf-instruments-opencl-hook-v1-linux-x64
    profiles: ["opencl-hook-v1"]
    command:
      - bash
      - infra/container_env/tasks/build-instruments.sh
      - --target-system
      - linux_x64_ubuntu24_04

  eperf-instruments-opencl-hook-v1-linux-aarch64-gnu11.3:
    <<: *opencl-hook-build
    container_name: eperf-instruments-opencl-hook-v1-linux-aarch64-gnu11.3
    profiles: ["opencl-hook-v1"]
    volumes:
      - type: bind
        source: ../../..
        target: /root/eperf-exporter
      - type: bind
        source: ${CACHE_ROOT:?CACHE_ROOT_is_required}
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ${GNU_AARCH64_TOOLCHAIN_ROOT:-../../../prebuilts/toolchains/gnu-aarch64/arm-gnu-toolchain-11.3.rel1-x86_64-aarch64-none-linux-gnu}
        target: /opt/toolchains/gnu-aarch64
        read_only: true
        bind:
          create_host_path: false
    command:
      - bash
      - infra/container_env/tasks/build-instruments.sh
      - --target-system
      - linux_aarch64_gnu11_3

  eperf-instruments-opencl-hook-v1-android-aarch64-ndk29:
    <<: *opencl-hook-build
    container_name: eperf-instruments-opencl-hook-v1-android-aarch64-ndk29
